<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Clone - Watch videos</title>
    
    <!-- Fonts for YouTube-like UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Material+Icons&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Meta tags for better SEO and appearance -->
    <meta name="description" content="YouTube Clone - Watch your favorite videos, music, gaming, and entertainment">
    <meta name="keywords" content="YouTube, videos, music, gaming, entertainment">
    <meta name="author" content="YouTube Clone">
    
    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#ff0000">
    
    <!-- Open Graph tags for social media -->
    <meta property="og:title" content="YouTube Clone">
    <meta property="og:description" content="Watch your favorite videos on YouTube Clone">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://youtube-clone.com">
    <meta property="og:image" content="https://youtube-clone.com/og-image.png">
    
    <!-- Twitter Card tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="YouTube Clone">
    <meta name="twitter:description" content="Watch your favorite videos on YouTube Clone">
    
    <!-- Favicon for different devices -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    
    <style>
      /* Prevent flash of unstyled content */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: 'Roboto', 'Segoe UI', Arial, sans-serif;
        background-color: #0f0f0f;
        color: #f1f1f1;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      /* Loading screen before React loads */
      #root {
        min-height: 100vh;
      }
      
      /* Material icons fallback */
      .material-icons {
        font-family: 'Material Icons';
        font-weight: normal;
        font-style: normal;
        font-size: 24px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-smoothing: antialiased;
      }
      
      /* Scrollbar styling */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      
      ::-webkit-scrollbar-track {
        background: #0f0f0f;
      }
      
      ::-webkit-scrollbar-thumb {
        background: #606060;
        border-radius: 5px;
      }
      
      ::-webkit-scrollbar-thumb:hover {
        background: #888;
      }
      
      /* Selection color */
      ::selection {
        background-color: #ff0000;
        color: white;
      }
    </style>
  </head>
  <body>
    <!-- Loading fallback -->
    <div id="loading-fallback" style="
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0f0f0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s;
    ">
      <div style="
        width: 80px;
        height: 80px;
        border: 4px solid rgba(255, 0, 0, 0.3);
        border-top: 4px solid #ff0000;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      "></div>
      <div style="color: #aaa; font-size: 18px; font-weight: 500;">YouTube Clone</div>
      <div style="color: #666; font-size: 14px; margin-top: 10px;">Loading...</div>
    </div>
    
    <div id="root"></div>
    
    <script type="module" src="/src/main.jsx"></script>
    
    <script>
      // Hide loading fallback when app is loaded
      window.addEventListener('load', function() {
        setTimeout(function() {
          const loadingFallback = document.getElementById('loading-fallback');
          if (loadingFallback) {
            loadingFallback.style.opacity = '0';
            setTimeout(() => {
              loadingFallback.style.display = 'none';
            }, 300);
          }
        }, 500);
      });
      
      // Animation for loading spinner
      const style = document.createElement('style');
      style.textContent = `
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      `;
      document.head.appendChild(style);
    </script>
  </body>
</html>
